[project]
name = "inpost-air"
version = "1.8.0"
readme = "README.md"
requires-python = ">=3.13.2"
dependencies = ["curl-cffi==0.16.3", "dacite==1.9.2", "python-slugify==9.1.2"]

[dependency-groups]
dev = [
    "homeassistant==2026.10.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-homeassistant-custom-component>=0.13.368",
    "pytest-json-ctrf>=0.3.5",
    "ruff>=0.13.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["api"]
